steps:
  - id: build-dbjob
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.dbjob
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:latest
      - .

  - id: push-dbjob
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}

  - id: provision-staff
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID"
        CONN="$(gcloud sql instances describe faralin-pg --project "$PROJECT_ID" --format='value(connectionName)')"
        gcloud run jobs update faralin-provision-staff \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --image "$$IMAGE" \
          --set-cloudsql-instances "$$CONN" \
          --set-secrets "DATABASE_URL=faralin_database_url:latest" \
          --command bash \
          --args=-lc,"pnpm --filter @faralin/db exec tsx prisma/provision-staff.ts ${_STAFF_EMAIL}" \
          2>/dev/null || gcloud run jobs create faralin-provision-staff \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --image "$$IMAGE" \
          --set-cloudsql-instances "$$CONN" \
          --set-secrets "DATABASE_URL=faralin_database_url:latest" \
          --command bash \
          --args=-lc,"pnpm --filter @faralin/db exec tsx prisma/provision-staff.ts ${_STAFF_EMAIL}"
        gcloud run jobs execute faralin-provision-staff \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --wait

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _DBJOB_IMAGE: faralin-dbjob
  _STAFF_EMAIL: navyateja919@gmail.com

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:latest
