steps:
  - id: build-dbjob
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.dbjob
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:latest
      - .

  - id: push-dbjob
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}

  - id: backfill-achievement-events
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID"
        CONN="$(gcloud sql instances describe faralin-pg --project "$PROJECT_ID" --format='value(connectionName)')"
        CMD="pnpm --filter @faralin/types build && pnpm --filter @faralin/db run generate:ci && pnpm --filter @faralin/db run backfill:achievement-events:ci"
        gcloud run jobs update faralin-backfill-achievements \
          --project "$PROJECT_ID" \
          --region asia-south1 \
          --image "$$IMAGE" \
          --set-cloudsql-instances "$$CONN" \
          --set-secrets "DATABASE_URL=faralin_database_url:latest" \
          --memory 1Gi \
          --task-timeout 30m \
          --command bash \
          --args=-lc,"$$CMD" \
          2>/dev/null || gcloud run jobs create faralin-backfill-achievements \
          --project "$PROJECT_ID" \
          --region asia-south1 \
          --image "$$IMAGE" \
          --set-cloudsql-instances "$$CONN" \
          --set-secrets "DATABASE_URL=faralin_database_url:latest" \
          --memory 1Gi \
          --task-timeout 30m \
          --command bash \
          --args=-lc,"$$CMD"
        gcloud run jobs execute faralin-backfill-achievements \
          --project "$PROJECT_ID" \
          --region asia-south1 \
          --wait

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _DBJOB_IMAGE: faralin-dbjob

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_DBJOB_IMAGE}:latest
