steps:
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    secretEnv: ['CLERK_PUBLISHABLE_KEY']
    args:
      - build
      - -f
      - Dockerfile.admin
      - --build-arg
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_PUBLIC_URL}
      - --build-arg
      - NEXT_PUBLIC_WEB_URL=${_WEB_PUBLIC_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}:latest
      - .

  - id: push-admin
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}:$BUILD_ID"
        gcloud run deploy "${_ADMIN_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "API_URL=${_API_PUBLIC_URL},NEXT_PUBLIC_WEB_URL=${_WEB_PUBLIC_URL}" \
          --set-secrets "CLERK_SECRET_KEY=faralin_clerk_secret_key:latest,CLERK_PUBLISHABLE_KEY=faralin_clerk_publishable_key:latest" \
          --min-instances 0 \
          --max-instances 5 \
          --memory 512Mi \
          --cpu 1

  - id: map-domain
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud beta run domain-mappings create \
          --service "${_ADMIN_SERVICE}" \
          --domain "${_ADMIN_DOMAIN}" \
          --region "${_REGION}" \
          2>/dev/null || echo "Domain mapping may already exist"

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _ADMIN_IMAGE: faralin-admin
  _ADMIN_SERVICE: faralin-admin
  _ADMIN_DOMAIN: admin.faralin.kaana.in
  _API_PUBLIC_URL: https://api.faralin.kaana.in
  _WEB_PUBLIC_URL: https://faralin.kaana.in

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/faralin_clerk_publishable_key/versions/latest
      env: CLERK_PUBLISHABLE_KEY

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_ADMIN_IMAGE}:latest
