steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    secretEnv: ['CLERK_PUBLISHABLE_KEY']
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_PUBLIC_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}:latest
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}:$BUILD_ID"
        gcloud run deploy "${_WEB_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "API_URL=${_API_PUBLIC_URL},NEXT_PUBLIC_UNIVERSITY_PORTAL_URL=${_UNIVERSITY_PUBLIC_URL}" \
          --set-secrets "CLERK_SECRET_KEY=faralin_clerk_secret_key:latest,CLERK_PUBLISHABLE_KEY=faralin_clerk_publishable_key:latest" \
          --min-instances 0 \
          --max-instances 5 \
          --memory 512Mi \
          --cpu 1

  - id: build-university
    name: gcr.io/cloud-builders/docker
    secretEnv: ['CLERK_PUBLISHABLE_KEY']
    args:
      - build
      - -f
      - Dockerfile.university
      - --build-arg
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_PUBLIC_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}:latest
      - .

  - id: push-university
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}

  - id: deploy-university
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}:$BUILD_ID"
        gcloud run deploy "${_UNIVERSITY_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "API_URL=${_API_PUBLIC_URL}" \
          --set-secrets "CLERK_SECRET_KEY=faralin_clerk_secret_key:latest,CLERK_PUBLISHABLE_KEY=faralin_clerk_publishable_key:latest" \
          --min-instances 0 \
          --max-instances 5 \
          --memory 512Mi \
          --cpu 1

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}:$BUILD_ID"
        gcloud run deploy "${_API_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --add-cloudsql-instances "kaana-prod:asia-south1:faralin-pg" \
          --set-secrets "DATABASE_URL=faralin_database_url:latest,CLERK_SECRET_KEY=faralin_clerk_secret_key:latest,CLERK_WEBHOOK_SECRET=faralin_clerk_webhook_secret:latest" \
          --set-env-vars "^|^WEB_URL=${_WEB_PUBLIC_URL}|UNIVERSITY_PORTAL_URL=${_UNIVERSITY_PUBLIC_URL}|ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}" \
          --min-instances 0 \
          --max-instances 5 \
          --memory 512Mi \
          --cpu 1

substitutions:
  _REGION: asia-south1
  _ARTIFACT_REPO: kaana
  _WEB_IMAGE: faralin-web
  _WEB_SERVICE: faralin-web
  _UNIVERSITY_IMAGE: faralin-university
  _UNIVERSITY_SERVICE: faralin-university
  _API_IMAGE: faralin-api
  _API_SERVICE: faralin-api
  _API_PUBLIC_URL: https://faralin-api-wtba53dhka-el.a.run.app
  _WEB_PUBLIC_URL: https://faralin-web-wtba53dhka-el.a.run.app
  _UNIVERSITY_PUBLIC_URL: https://university.faralin.kaana.in
  _ALLOWED_ORIGINS: https://faralin-web-wtba53dhka-el.a.run.app,https://faralin-web-851239127958.asia-south1.run.app,https://faralin.kaana.in,https://university.faralin.kaana.in,https://admin.faralin.kaana.in,http://localhost:3002

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/faralin_clerk_publishable_key/versions/latest
      env: CLERK_PUBLISHABLE_KEY

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_WEB_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_UNIVERSITY_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_API_IMAGE}:latest
